<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Essensplan</title>
<style>
  :root{--bg:#fbf8f3;--card:#fff;--ink:#2b2620;--muted:#7a7066;--line:#ece4d8;--accent:#c4552d;--bring:#e2463b;--ok:#3f7d4e}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:1.7rem;margin:0 0 4px}
  h2{font-size:1.25rem;margin:40px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--line)}
  h3{margin:0;font-size:1.15rem}
  .sub{color:var(--muted);margin:0 0 16px}
  .bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .bar label{font-weight:600}
  .bar input{width:64px;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:8px}
  .hint{color:var(--muted);font-size:.85rem}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:#f4ede3;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  tr:last-child td{border-bottom:0}
  td a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px dashed var(--accent)}
  .recipe{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;scroll-margin-top:12px}
  .rhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
  .day{color:var(--accent);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
  .meta{color:var(--muted);font-size:.9rem;margin-top:2px}
  .meta a{color:var(--muted)}
  .cols{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;margin-top:12px}
  @media(max-width:640px){.cols{grid-template-columns:1fr}}
  ul.ing{margin:0;padding-left:18px} ol.steps{margin:0;padding-left:20px}
  .note{background:#fff6e6;border-radius:8px;padding:8px 10px;margin-top:10px;font-size:.9rem}
  .bring{display:inline-flex;align-items:center;gap:8px;background:var(--bring);color:#fff;text-decoration:none;font-weight:700;padding:8px 14px;border-radius:999px;white-space:nowrap}
  .bring:hover{filter:brightness(.93)}
  .bring svg{width:18px;height:18px}
  .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .group{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .group h4{margin:0 0 6px;font-size:.95rem}
  .group label{display:flex;gap:8px;padding:3px 0;cursor:pointer}
  .group input:checked+span{text-decoration:line-through;color:var(--muted)}
  .used{color:var(--muted);font-size:.8rem}
  .btn{font:inherit;font-weight:600;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
  .bring.week{background:var(--ink)}
  .bringlist{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
  textarea#copybox{width:100%;height:160px;margin-top:10px;display:none;font:14px/1.4 ui-monospace,monospace}
  footer{margin-top:40px;color:var(--muted);font-size:.85rem}
  @media print{.bar,.bring,.btn,.bringlist{display:none}.recipe{break-inside:avoid}}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>

  <div class="bar">
    <label for="portions">Portionen</label>
    <input id="portions" type="number" min="1" max="12" step="1">
    <span class="hint">Ändert die Mengen auf dieser Seite und in allen Bring!-Buttons.</span>
  </div>

  <h2>Wochenübersicht</h2>
  <table>
    <thead><tr><th>Tag</th><th>Gericht</th><th>Zeit</th></tr></thead>
    <tbody id="overview"></tbody>
  </table>

  <h2>Rezepte</h2>
  <div id="recipes"></div>

  <h2>Einkaufsliste</h2>
  <p class="hint">„Ganze Woche in Bring!“ übernimmt die komplette Liste unten (ohne Vorräte) auf einmal. Alternativ einzelne Tage übernehmen.</p>
  <div class="bringlist" id="bringlist"></div>
  <div class="groups" id="shopping"></div>
  <p style="margin-top:14px"><button class="btn" id="copy">Liste als Text kopieren</button> <span class="hint" id="copymsg"></span></p>
  <textarea id="copybox" readonly></textarea>

  <footer id="footer"></footer>
</main>

<script>

const BRING_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmt(n){
  if (n == null || isNaN(n)) return '';
  if (n >= 100) return String(Math.round(n / 5) * 5);
  if (n >= 10) return String(Math.round(n));
  const r = Math.round(n * 4) / 4;
  const whole = Math.floor(r), frac = r - whole;
  const f = {0:'',0.25:'¼',0.5:'½',0.75:'¾'}[frac];
  if (f === undefined) return r.toLocaleString('de-DE');
  return (whole ? whole + (f ? ' ' : '') : '') + f || '0';
}
function amount(i, factor){
  if (i.n == null) return esc(i.u || '');
  return fmt(i.n * factor) + (i.u ? ' ' + esc(i.u) : '');
}
// Bring!-Link über die Brückenseite im Repo: öffnet auf Android die App per Intent
// (package ch.publisheria.bring), sonst deeplink.getbring.com bzw. Bring! Web.
const BRIDGE = 'https://lukasniestroj.github.io/wochenplan/bring.html';
function bringHref(url, portions, name){
  const parser = 'https://api.getbring.com/rest/bringrecipes/parser'
    + '?url=' + encodeURIComponent(url)
    + '&baseQuantity=' + encodeURIComponent(PLAN.portionen)
    + '&requestedQuantity=' + encodeURIComponent(portions);
  return BRIDGE + '?src=' + encodeURIComponent(btoa(parser)) + (name ? '&name=' + encodeURIComponent(name) : '');
}

function render(){
  const portions = Math.max(1, parseInt($('#portions').value, 10) || PLAN.portionen);
  const factor = portions / PLAN.portionen;

  $('#overview').innerHTML = PLAN.tage.map(d =>
    `<tr><td><strong>${esc(d.tag)}</strong><br><span class="hint">${esc(d.datum)}</span></td>
     <td><a href="#r-${esc(d.id)}">${esc(d.gericht)}</a></td><td>${esc(d.minuten)} Min.</td></tr>`).join('');

  $('#recipes').innerHTML = PLAN.tage.map(d => `
    <article class="recipe" id="r-${esc(d.id)}">
      <div class="rhead">
        <div>
          <div class="day">${esc(d.tag)} · ${esc(d.datum)}</div>
          <h3>${esc(d.gericht)}</h3>
          <div class="meta">${esc(d.minuten)} Min. · ${portions} Portionen · Vorlage: <a href="${esc(d.quelle_url)}" target="_blank" rel="noopener">${esc(d.quelle_name)}</a></div>
        </div>
        <a class="bring" href="${bringHref(d.bring_url, portions, d.gericht)}" target="_blank" rel="noopener">${BRING_ICON} In Bring! übernehmen</a>
      </div>
      <div class="cols">
        <ul class="ing">${d.zutaten.map(i => `<li>${amount(i, factor)} ${esc(i.name)}</li>`).join('')}</ul>
        <ol class="steps">${d.schritte.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
      </div>
      ${d.tipp ? `<div class="note">💡 ${esc(d.tipp)}</div>` : ''}
    </article>`).join('');

  $('#bringlist').innerHTML = `<a class="bring week" href="${bringHref(PLAN.einkauf_bring_url, portions, 'Wocheneinkauf')}" target="_blank" rel="noopener">${BRING_ICON} Ganze Woche in Bring!</a>` + PLAN.tage.map(d =>
    `<a class="bring" href="${bringHref(d.bring_url, portions, d.gericht)}" target="_blank" rel="noopener">${BRING_ICON} ${esc(d.tag.slice(0,2))}: ${esc(d.gericht)}</a>`).join('');

  const saved = loadChecks();
  $('#shopping').innerHTML = PLAN.einkauf.map((g, gi) => `
    <div class="group"><h4>${esc(g.abteilung)}</h4>
      ${g.artikel.map((a, ai) => {
        const key = gi + ':' + ai;
        return `<label><input type="checkbox" data-k="${key}" ${saved[key] ? 'checked' : ''}>
          <span>${esc(a.name)}${(a.n != null || a.u) ? ' – ' + amount(a, g.vorrat ? 1 : factor) : ''}${a.fuer ? ` <span class="used">(${esc(a.fuer)})</span>` : ''}</span></label>`;
      }).join('')}
    </div>`).join('');
}

function loadChecks(){ try { return JSON.parse(localStorage.getItem('ep-' + PLAN.titel) || '{}'); } catch(e){ return {}; } }
function saveChecks(o){ try { localStorage.setItem('ep-' + PLAN.titel, JSON.stringify(o)); } catch(e){} }

document.addEventListener('change', e => {
  if (e.target.matches('#shopping input[type=checkbox]')) {
    const o = loadChecks(); o[e.target.dataset.k] = e.target.checked; saveChecks(o);
  }
});
$('#portions').addEventListener('input', render);

$('#copy').addEventListener('click', async () => {
  const portions = Math.max(1, parseInt($('#portions').value, 10) || PLAN.portionen);
  const factor = portions / PLAN.portionen;
  const text = PLAN.einkauf.filter(g => !g.vorrat)
    .flatMap(g => g.artikel.map(a => a.name + (a.n != null || a.u ? ' ' + amount(a, factor).replace(/&amp;/g,'&') : ''))).join('\n');
  try { await navigator.clipboard.writeText(text); $('#copymsg').textContent = 'Kopiert ✓'; }
  catch(e){ const b = $('#copybox'); b.style.display = 'block'; b.value = text; b.select(); $('#copymsg').textContent = 'Text markiert – bitte manuell kopieren.'; }
});

document.title = PLAN.titel;
$('#title').textContent = PLAN.titel;
$('#subtitle').textContent = PLAN.untertitel || '';
$('#footer').textContent = PLAN.fusszeile || '';
$('#portions').value = PLAN.portionen;
render();
</script>
</body>
</html>
